{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Shopping Cart</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'shop/style.css' %}" />
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <nav class="navbar navbar-expand-lg navbar-dark bg-dark custom-navbar">
            <div class="container-fluid">
              <a class="navbar-brand text-warning" href="{% url 'index' %}">ShopZone</a>
              <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                  <a class="nav-link text-white" href="{% url 'index' %}">Home</a>
                </li>
              </ul>
            </div>
          </nav>
        </div>
      </div>

      <div class="row mt-5">
        <div class="col-md-12">
          <h1 style="color: var(--card-text);">🛒 Your Shopping Cart</h1>
          <hr style="border-color: #383838;">
        </div>
      </div>
      
      <div class="row">
        <div class="col-md-8">
          <div id="cart-items-container" class="list-group">
            </div>
        </div>
        
        <div class="col-md-4">
          <div class="card p-4 checkout-card sticky-top" style="top: 20px;">
            <h4 class="card-title" style="color: var(--primary-yellow);">Order Totals</h4>
            <hr>
            <div class="d-flex justify-content-between mb-4">
              <h5 class="mb-0 fw-bold" style="color: var(--card-text);">Total:</h5>
              <h5 class="mb-0 fw-bold text-orange" id="cart-total-price">₹0.00</h5>
            </div>
            
            <a href="{% url 'checkout' %}" id="proceed-to-checkout" class="btn btn-lg w-100 add-to-cart-btn mb-2">
              Proceed to Checkout
            </a>
            
            <button id="clear-cart-btn" class="btn btn-md btn-outline-dark w-100">
              Clear Cart
            </button>
          </div>
        </div>
      </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript">
      // 1. Load Data
      var productMap = {};
      var django_products = [
          {% for product in product_objects %}
          {
              'id': {{ product.id }},
              'title': '{{ product.title|escapejs }}',
              'price': {{ product.price }},
              'discount_price': {{ product.discount_price }},
              'image': '{{ product.image|escapejs }}',
              'stock': {{ product.stock }},
          }{% if not forloop.last %},{% endif %}
          {% endfor %}
      ];

      django_products.forEach(p => {
          // CALCULATE SELLING PRICE
          p.selling_price = (p.discount_price > 0 && p.discount_price < p.price) ? p.discount_price : p.price;
          productMap[p.id] = p;
      });

      function getCart() {
          return JSON.parse(localStorage.getItem("cart") || '{}');
      }

      function setCart(cart) {
          localStorage.setItem("cart", JSON.stringify(cart));
      }

      // 2. Render Cart
      function renderCart() {
          let cart = getCart();
          let container = $('#cart-items-container');
          let cartTotal = 0;
          container.empty();
          
          if (Object.keys(cart).length === 0) {
              container.append('<div class="alert alert-info text-center" style="color: var(--card-text); background-color: #f0f0f0; border-color: #ddd;">Your cart is empty.</div>');
              $('#proceed-to-checkout').prop('disabled', true).text('Cart is Empty');
              $('#clear-cart-btn').prop('disabled', true);
              $('#cart-total-price').text('₹0.00');
              return;
          }
          
          $('#proceed-to-checkout').prop('disabled', false).text('Proceed to Checkout');
          $('#clear-cart-btn').prop('disabled', false);


          for (let itemId in cart) {
              let qty = cart[itemId];
              let product = productMap[itemId];

              if (!product) continue; 
              
              let itemTotal = product.selling_price * qty;
              cartTotal += itemTotal;
              
              let stockStatus = (product.stock < qty) ? 
                  `<small class="text-danger fw-bold">Only ${product.stock} in stock!</small>` : 
                  `<small class="text-secondary">In Stock: ${product.stock}</small>`;
              
              // Price display with strike-through for discount
              let priceDisplay = (product.discount_price > 0 && product.discount_price < product.price) ?
                  `<small class="text-secondary text-decoration-line-through me-2">₹${product.price.toFixed(2)}</small><span class="text-orange fw-bold">₹${product.selling_price.toFixed(2)}</span>` :
                  `<span class="text-orange fw-bold">₹${product.selling_price.toFixed(2)}</span>`;

              let itemHtml = `
                  <li class="list-group-item d-flex justify-content-between align-items-center mb-3 p-3 product-card">
                      <div class="d-flex align-items-center flex-grow-1">
                          <img src="${product.image}" alt="${product.title}" style="width: 80px; height: 80px; object-fit: contain; margin-right: 15px; border-radius: 5px; background-color: #eee;">
                          <div>
                              <h5 class="mb-1 fw-bold" style="color: #000;">${product.title}</h5>
                              <p class="mb-0">Unit Price: ${priceDisplay}</p>
                              <p class="mb-0">${stockStatus}</p>
                          </div>
                      </div>
                      
                      <div class="d-flex align-items-center">
                          <div class="input-group input-group-sm me-3" style="width: 130px;">
                              <button class="btn btn-outline-dark update-qty" data-id="${itemId}" data-action="minus" type="button">-</button>
                              <input type="text" class="form-control text-center" value="${qty}" readonly>
                              <button class="btn btn-outline-dark update-qty" data-id="${itemId}" data-action="plus" type="button" 
                                  {% if product.stock <= 0 %}disabled{% endif %}
                              >+</button>
                          </div>
                          <div class="fw-bold text-orange me-3" style="min-width: 80px; text-align: right;">
                              ₹${itemTotal.toFixed(2)}
                          </div>
                          <button class="btn btn-danger remove-item" data-id="${itemId}">Remove</button>
                      </div>
                  </li>
              `;
              container.append(itemHtml);
          }

          $('#cart-total-price').text(`₹${cartTotal.toFixed(2)}`);
      }

      // 3. Event Handlers
      $(document).ready(function() {
          renderCart();
          
          // Handle Quantity Updates
          $(document).on('click', '.update-qty', function() {
              let itemId = $(this).data('id').toString();
              let action = $(this).data('action');
              let cart = getCart();
              let product = productMap[itemId];

              if (!product) return;

              if (action === 'plus') {
                  if (cart[itemId] < product.stock) {
                      cart[itemId] = cart[itemId] + 1;
                  } else {
                      alert(`Cannot add more, only ${product.stock} available.`);
                  }
              } else if (action === 'minus') {
                  if (cart[itemId] > 1) {
                      cart[itemId] = cart[itemId] - 1;
                  } else {
                      // If quantity is 1 and minus is clicked, remove the item
                      delete cart[itemId];
                  }
              }
              
              setCart(cart);
              renderCart();
          });

          // Handle Remove Item
          $(document).on('click', '.remove-item', function() {
              let itemId = $(this).data('id').toString();
              let cart = getCart();
              delete cart[itemId];
              setCart(cart);
              renderCart();
          });
          
          // Handle Clear Cart
          $('#clear-cart-btn').on('click', function() {
              if (confirm("Are you sure you want to clear your shopping cart?")) {
                  localStorage.removeItem("cart");
                  renderCart();
              }
          });
      });
    </script>
  </body>
</html>
